name: Jaga Supabase

on:
  schedule:
    - cron: "17 1 */3 * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase
        run: |
          kod=$(curl -s -o /dev/null -w "%{http_code}" "https://cgddwlscylvxbwkwbgzk.supabase.co/rest/v1/idme_kategori?select=id&limit=1" -H "apikey: sb_publishable_9mHWI4BxESDLswhJ-DmgOw_wEYV9oAZ")
          echo "Status: $kod"
          test "$kod" = "200"
